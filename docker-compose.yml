version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orbicheck
      POSTGRES_USER: orbicheck
      POSTGRES_PASSWORD: orbicheck
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbicheck"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  scan-service:
    build:
      context: backend/scan
      dockerfile: ../../docker/scan/Dockerfile
    ports:
      - "4000:4000"
    environment:
      SCAN_SERVICE_PORT: 4000
    depends_on:
      - redis

  backend:
    build:
      context: backend
      dockerfile: ../docker/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://orbicheck:orbicheck@postgres:5432/orbicheck
      REDIS_URL: redis://redis:6379/0
      SCAN_SERVICE_URL: http://scan-service:4000
      CORS_ORIGINS: '["http://localhost:3000"]'
      AUTH_LOGIN_EMAIL: admin@orbicheck.local
      AUTH_LOGIN_PASSWORD: change-me
      AUTH_SESSION_SECRET: change-me-to-a-long-random-secret
      AUTH_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scan-service:
        condition: service_started

  # Frontend — uncomment when you have a production build setup
  # frontend:
  #   build:
  #     context: .
  #     dockerfile: docker/frontend/Dockerfile
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://backend:8000
  #   depends_on:
  #     - backend

volumes:
  pgdata:
