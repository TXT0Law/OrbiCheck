name: orbicheck

x-service-limits: &service-limits
  init: true
  restart: unless-stopped
  cpus: "1.0"
  mem_limit: 512m
  pids_limit: 256
  stop_grace_period: 30s

x-app-hardening: &app-hardening
  <<: *service-limits
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,mode=1777,size=256m

services:
  postgres:
    <<: *service-limits
    mem_limit: 768m
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbicheck}
      POSTGRES_USER: ${POSTGRES_USER:-orbicheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbicheck}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - orbicheck

  redis:
    <<: *service-limits
    mem_limit: 256m
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - orbicheck

  scan-service:
    <<: *app-hardening
    mem_limit: 1536m
    pids_limit: 512
    tmpfs:
      - /tmp:rw,nosuid,mode=1777,size=512m
    build:
      context: .
      dockerfile: docker/scan/Dockerfile
    env_file:
      - ./backend/scan/.env
    environment:
      SCAN_SERVICE_PORT: 4000
      INTERNAL_SERVICE_AUTH_REQUIRED: "true"
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-orbicheck-local-internal-auth-secret-0001}
    expose:
      - "4000"
    # R-4: scan-service makes high-volume outbound DNS lookups for arbitrary
    # user-supplied URLs. The Docker embedded resolver (127.0.0.11) returns
    # EAI_AGAIN under load, which used to mark whole scans as fatal failures
    # (see backend/app/utils/url_safety.py for the application-level retry).
    # Pin Cloudflare + Google as upstream to bypass the embedded resolver
    # altogether — both are anycast and free.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health').then((response) => { if (!response.ok) process.exit(1); process.exit(0); }).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - orbicheck

  scanner:
    <<: *app-hardening
    build:
      context: .
      dockerfile: docker/scanner/Dockerfile
    expose:
      - "5000"
    environment:
      INTERNAL_SERVICE_AUTH_REQUIRED: "true"
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-orbicheck-local-internal-auth-secret-0001}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/ready', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - orbicheck

  backend:
    <<: *app-hardening
    mem_limit: 1024m
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+asyncpg://orbicheck:orbicheck@postgres:5432/orbicheck}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      SCAN_SERVICE_URL: ${DOCKER_SCAN_SERVICE_URL:-http://scan-service:4000}
      NMAP_SCANNER_URL: ${DOCKER_NMAP_SCANNER_URL:-http://scanner:5000}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-orbicheck-local-internal-auth-secret-0001}
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
      AUTH_COOKIE_SECURE: "false"
      AUTH_DEV_BYPASS_ENABLED: ${AUTH_DEV_BYPASS_ENABLED:-true}
      MONITOR_INLINE_DISPATCH: "false"
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
    ports:
      - "8000:8000"
    # R-4: SSRF guard (`backend/app/utils/url_safety.py`) calls
    # `socket.getaddrinfo` for every scanned hostname. The embedded resolver
    # was the source of the "Cannot resolve hostname" fatal failures users
    # saw in scan logs.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scan-service:
        condition: service_healthy
      scanner:
        condition: service_healthy
    networks:
      - orbicheck

  celery-worker:
    <<: *app-hardening
    mem_limit: 1024m
    pids_limit: 512
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: ["/usr/local/bin/celery-entrypoint.sh"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+asyncpg://orbicheck:orbicheck@postgres:5432/orbicheck}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      SCAN_SERVICE_URL: ${DOCKER_SCAN_SERVICE_URL:-http://scan-service:4000}
      NMAP_SCANNER_URL: ${DOCKER_NMAP_SCANNER_URL:-http://scanner:5000}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-orbicheck-local-internal-auth-secret-0001}
      MONITOR_INLINE_DISPATCH: "false"
      CELERY_MODE: worker
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
    # R-4: Celery worker calls `validate_url_safety` (DNS lookup) before
    # dispatching scan modules — same fix as the backend service.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scan-service:
        condition: service_healthy
      scanner:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.core.celery_app.celery_app inspect ping --destination celery@$$(hostname) --timeout 5 >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - orbicheck

  celery-beat:
    <<: *app-hardening
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: ["/usr/local/bin/celery-entrypoint.sh"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+asyncpg://orbicheck:orbicheck@postgres:5432/orbicheck}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      SCAN_SERVICE_URL: ${DOCKER_SCAN_SERVICE_URL:-http://scan-service:4000}
      NMAP_SCANNER_URL: ${DOCKER_NMAP_SCANNER_URL:-http://scanner:5000}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-orbicheck-local-internal-auth-secret-0001}
      MONITOR_INLINE_DISPATCH: "false"
      CELERY_MODE: beat
      CELERY_BEAT_SCHEDULE_FILE: /tmp/celerybeat-schedule
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scan-service:
        condition: service_healthy
      scanner:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from pathlib import Path; from redis import Redis; from app.core.config import settings; Redis.from_url(settings.REDIS_URL).ping(); commands = [p.read_bytes().decode(errors='ignore') for p in Path('/proc').glob('[0-9]*/cmdline') if p.exists()]; raise SystemExit(0 if any('celery' in command and 'beat' in command for command in commands) else 1)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - orbicheck

  frontend:
    <<: *app-hardening
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,mode=1777,size=128m
      - /app/.next/cache:rw,noexec,nosuid,mode=1777,size=256m
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_DEV_BYPASS_ENABLED: ${NEXT_PUBLIC_AUTH_DEV_BYPASS_ENABLED:-true}
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
        DISABLE_API_REWRITE: ${DISABLE_API_REWRITE:-0}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_AUTH_DEV_BYPASS_ENABLED: ${NEXT_PUBLIC_AUTH_DEV_BYPASS_ENABLED:-true}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000', { redirect: 'manual' }).then((response) => { if (response.status >= 200 && response.status < 400) process.exit(0); process.exit(1); }).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - orbicheck

volumes:
  postgres-data:

networks:
  orbicheck:
    driver: bridge
