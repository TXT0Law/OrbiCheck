name: orbicheck

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbicheck}
      POSTGRES_USER: ${POSTGRES_USER:-orbicheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbicheck}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - orbicheck

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - orbicheck

  scan-service:
    build:
      context: .
      dockerfile: docker/scan/Dockerfile
    env_file:
      - ./backend/scan/.env
    environment:
      SCAN_SERVICE_PORT: 4000
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health').then((response) => { if (!response.ok) process.exit(1); process.exit(0); }).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - orbicheck

  scanner:
    build:
      context: .
      dockerfile: docker/scanner/Dockerfile
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - orbicheck

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+asyncpg://orbicheck:orbicheck@postgres:5432/orbicheck}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      SCAN_SERVICE_URL: ${DOCKER_SCAN_SERVICE_URL:-http://scan-service:4000}
      NMAP_SCANNER_URL: ${DOCKER_NMAP_SCANNER_URL:-http://scanner:5000}
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
      AUTH_COOKIE_SECURE: "false"
      MONITOR_INLINE_DISPATCH: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scan-service:
        condition: service_healthy
      scanner:
        condition: service_healthy
    networks:
      - orbicheck

  celery-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: ["/usr/local/bin/celery-entrypoint.sh"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+asyncpg://orbicheck:orbicheck@postgres:5432/orbicheck}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      SCAN_SERVICE_URL: ${DOCKER_SCAN_SERVICE_URL:-http://scan-service:4000}
      NMAP_SCANNER_URL: ${DOCKER_NMAP_SCANNER_URL:-http://scanner:5000}
      MONITOR_INLINE_DISPATCH: "false"
      CELERY_MODE: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scan-service:
        condition: service_healthy
      scanner:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import pathlib, sys; sys.exit(0 if 'worker' in pathlib.Path('/proc/1/cmdline').read_text() else 1)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - orbicheck

  celery-beat:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: ["/usr/local/bin/celery-entrypoint.sh"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+asyncpg://orbicheck:orbicheck@postgres:5432/orbicheck}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      SCAN_SERVICE_URL: ${DOCKER_SCAN_SERVICE_URL:-http://scan-service:4000}
      NMAP_SCANNER_URL: ${DOCKER_NMAP_SCANNER_URL:-http://scanner:5000}
      MONITOR_INLINE_DISPATCH: "false"
      CELERY_MODE: beat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scan-service:
        condition: service_healthy
      scanner:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import pathlib, sys; sys.exit(0 if 'beat' in pathlib.Path('/proc/1/cmdline').read_text() else 1)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - orbicheck

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
        DISABLE_API_REWRITE: ${DISABLE_API_REWRITE:-0}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000', { redirect: 'manual' }).then((response) => { if (response.status >= 200 && response.status < 400) process.exit(0); process.exit(1); }).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - orbicheck

volumes:
  postgres-data:

networks:
  orbicheck:
    driver: bridge
