[project]
name = "orbicheck-backend"
version = "0.1.0"
description = "OrbiCheck Backend API — FastAPI service for external-perspective website security assessment"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "redis[hiredis]>=5.0.0",
    "celery[redis]>=5.4.0",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "structlog>=24.0.0",
    "prometheus-client>=0.21.0",
    "beautifulsoup4>=4.14.3",
    "fpdf2>=2.8.0",
    "cryptography>=42.0.0",
    "pillow>=10.4.0",
    "ImageHash>=4.3.1",
    "aiosmtplib>=5.1.0",
    "dnspython>=2.6.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "respx>=0.21.0",
    "fakeredis[lua]>=2.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: Unit tests that do not require external services",
    "integration: Integration tests that may rely on app-level wiring",
    "e2e: End-to-end flow tests",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
