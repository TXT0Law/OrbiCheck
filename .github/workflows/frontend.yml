name: Frontend Tests

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vitest.config.ts"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vitest.config.ts"
      - ".github/workflows/frontend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test
