name: orbicheck
region: nyc

services:
  - name: frontend
    github:
      repo: TXT0Law/OrbiCheck
      branch: main
      deploy_on_push: true
    source_dir: .
    dockerfile_path: docker/frontend/Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: NEXT_PUBLIC_API_URL
        value: http://localhost:8000
        scope: BUILD_TIME
      - key: DISABLE_API_REWRITE
        value: "1"
        scope: BUILD_TIME

  - name: backend
    github:
      repo: TXT0Law/OrbiCheck
      branch: main
      deploy_on_push: true
    source_dir: .
    dockerfile_path: docker/backend/Dockerfile
    http_port: 8000
    internal_ports: [8000]
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      initial_delay_seconds: 15
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
      http_path: /api/v1/health
      port: 8000
    envs:
      - key: DATABASE_URL
        value: ${postgres-db.DATABASE_URL}
        scope: RUN_TIME
        type: secret
      - key: REDIS_URL
        value: ${redis-db.DATABASE_URL}
        scope: RUN_TIME
        type: secret
      - key: SCAN_SERVICE_URL
        value: ${scan-service.PRIVATE_URL}
        scope: RUN_TIME
      - key: NMAP_SCANNER_URL
        value: ${scanner.PRIVATE_URL}
        scope: RUN_TIME
      - key: CORS_ORIGINS
        value: ${frontend.PUBLIC_URL}
        scope: RUN_TIME
      - key: AUTH_LOGIN_EMAIL
        value: admin@orbicheck.app
        scope: RUN_TIME
      - key: AUTH_LOGIN_PASSWORD
        value: change-me-before-production
        scope: RUN_TIME
        type: secret
      - key: AUTH_SESSION_SECRET
        value: replace-with-a-long-random-secret
        scope: RUN_TIME
        type: secret
      - key: AUTH_COOKIE_SECURE
        value: "true"
        scope: RUN_TIME
      - key: MONITOR_INLINE_DISPATCH
        value: "false"
        scope: RUN_TIME

  - name: scan-service
    github:
      repo: TXT0Law/OrbiCheck
      branch: main
      deploy_on_push: true
    source_dir: .
    dockerfile_path: docker/scan/Dockerfile
    internal_ports: [4000]
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: SCAN_SERVICE_PORT
        value: "4000"
        scope: RUN_TIME
      - key: NODE_ENV
        value: production
        scope: RUN_TIME

  - name: scanner
    github:
      repo: TXT0Law/OrbiCheck
      branch: main
      deploy_on_push: true
    source_dir: .
    dockerfile_path: docker/scanner/Dockerfile
    internal_ports: [5000]
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb

workers:
  - name: celery-worker
    github:
      repo: TXT0Law/OrbiCheck
      branch: main
      deploy_on_push: true
    source_dir: .
    dockerfile_path: docker/backend/Dockerfile
    run_command: /usr/local/bin/celery-entrypoint.sh
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: DATABASE_URL
        value: ${postgres-db.DATABASE_URL}
        scope: RUN_TIME
        type: secret
      - key: REDIS_URL
        value: ${redis-db.DATABASE_URL}
        scope: RUN_TIME
        type: secret
      - key: SCAN_SERVICE_URL
        value: ${scan-service.PRIVATE_URL}
        scope: RUN_TIME
      - key: NMAP_SCANNER_URL
        value: ${scanner.PRIVATE_URL}
        scope: RUN_TIME
      - key: CELERY_MODE
        value: worker
        scope: RUN_TIME
      - key: MONITOR_INLINE_DISPATCH
        value: "false"
        scope: RUN_TIME

  - name: celery-beat
    github:
      repo: TXT0Law/OrbiCheck
      branch: main
      deploy_on_push: true
    source_dir: .
    dockerfile_path: docker/backend/Dockerfile
    run_command: /usr/local/bin/celery-entrypoint.sh
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: DATABASE_URL
        value: ${postgres-db.DATABASE_URL}
        scope: RUN_TIME
        type: secret
      - key: REDIS_URL
        value: ${redis-db.DATABASE_URL}
        scope: RUN_TIME
        type: secret
      - key: SCAN_SERVICE_URL
        value: ${scan-service.PRIVATE_URL}
        scope: RUN_TIME
      - key: NMAP_SCANNER_URL
        value: ${scanner.PRIVATE_URL}
        scope: RUN_TIME
      - key: CELERY_MODE
        value: beat
        scope: RUN_TIME
      - key: MONITOR_INLINE_DISPATCH
        value: "false"
        scope: RUN_TIME

databases:
  - name: postgres-db
    engine: PG
    version: "16"
    production: false

  - name: redis-db
    engine: REDIS
    version: "7"
    production: false

ingress:
  rules:
    - match:
        path:
          prefix: /api/v1
      component:
        name: backend
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: frontend
        preserve_path_prefix: true
